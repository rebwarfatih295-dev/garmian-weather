<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>کەشوهەوای گەرمیان</title>
  <style>
    :root {
      --bg-grad: linear-gradient(160deg, #0f172a 0%, #1e3a8a 55%, #0284c7 100%);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.78);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px;
    }
    .header h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.3px; }
    .refresh-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .status-bar {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .city-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .city-tabs::-webkit-scrollbar { display: none; }
    .city-tab {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 9px 16px;
      border-radius: 22px;
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .city-tab.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .city-name { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .weather-icon { font-size: 4.2rem; margin: 10px 0; }
    .temp-now { font-size: 3.6rem; font-weight: 800; line-height: 1; margin-bottom: 8px; direction: ltr; }
    .weather-desc { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 18px; }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      border-top: 1px solid var(--card-border);
      padding-top: 16px;
    }
    .detail-box {
      background: rgba(0, 0, 0, 0.16);
      padding: 10px 6px;
      border-radius: 14px;
    }
    .detail-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
    .detail-val { font-size: 1rem; font-weight: 700; direction: ltr; }
    .all-cities-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 18px 4px 10px;
    }
    .city-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .city-list-left { display: flex; align-items: center; gap: 10px; }
    .city-list-name { font-size: 1.05rem; font-weight: 700; }
    .city-list-desc { font-size: 0.82rem; color: var(--text-muted); }
    .city-list-temp { font-size: 1.35rem; font-weight: 800; direction: ltr; }
    .about-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px 16px;
      margin-top: 22px;
      text-align: center;
    }
    .about-title { font-size: 0.85rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .dev-name { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; }
    .contact-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      flex: 1;
      min-width: 140px;
    }
    .btn-fb {
      background: #1877f2;
      color: #ffffff;
    }
    .btn-phone {
      background: #10b981;
      color: #ffffff;
      direction: ltr;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌤️ کەشوهەوای گەرمیان</h1>
    <button class="refresh-btn" onclick="loadAllWeather()">زیندوو 🔄</button>
  </div>
  <div class="status-bar" id="statusText">چاوەڕوانی وەرگرتنی زانیاری...</div>

  <div class="city-tabs" id="cityTabs"></div>

  <div class="main-card" id="mainCard">
    <div class="city-name" id="selectedName">کەلار</div>
    <div class="weather-icon" id="selectedIcon">⛅</div>
    <div class="temp-now" id="selectedTemp">--°C</div>
    <div class="weather-desc" id="selectedDesc">بارکردن...</div>
    <div class="details-grid">
      <div class="detail-box">
        <div class="detail-label">خێرایی با</div>
        <div class="detail-val" id="selectedWind">-- km/h</div>
      </div>
      <div class="detail-box">
        <div class="detail-label">ڕێژەی شێ</div>
        <div class="detail-val" id="selectedHumidity">--%</div>
      </div>
      <div class="detail-box">
        <div class="detail-label">بارانبارین</div>
        <div class="detail-val" id="selectedRain">-- mm</div>
      </div>
    </div>
  </div>

  <div class="all-cities-title">هەموو ناوچەکانی گەرمیان</div>
  <div id="citiesList"></div>

  <div class="about-card">
    <div class="about-title">پەرەپێدان و دیزاین لەلایەن</div>
    <div class="dev-name">ڕێبوار مانج علی</div>
    <div class="contact-buttons">
      <a class="contact-btn btn-fb" href="https://www.facebook.com/share/1TYJHD6yvN/?mibextid=wwXIfr" target="_blank">
        🔵 فەیسبووک
      </a>
      <a class="contact-btn btn-phone" href="tel:07703251415">
        📞 0770 325 1415
      </a>
    </div>
  </div>

  <script>
    const cities = [
      { id: 'kalar', name: 'کەلار', lat: 34.6225, lon: 45.3219 },
      { id: 'rizgari', name: 'ڕزگاری', lat: 34.6750, lon: 45.3111 },
      { id: 'kifri', name: 'کفری', lat: 34.6897, lon: 44.9606 },
      { id: 'khanaqin', name: 'خانەقین', lat: 34.3481, lon: 45.3906 },
      { id: 'bawanoor', name: 'باوەنوور', lat: 34.8631, lon: 45.4519 },
      { id: 'darbandikhan', name: 'دەربەندیخان', lat: 35.1136, lon: 45.6872 },
      { id: 'sarqala', name: 'سەرقەڵا', lat: 34.7736, lon: 45.2289 }
    ];

    let weatherData = {};
    let currentCityId = 'kalar';

    function getWeatherInfo(code) {
      if (code === 0) return { icon: '☀️', text: 'ئاسمان ساماڵە' };
      if (code <= 3) return { icon: '⛅', text: 'نیمچە هەور' };
      if (code <= 48) return { icon: '🌫️', text: 'تەمومژ' };
      if (code <= 67) return { icon: '🌧️', text: 'بارانبارین' };
      if (code <= 77) return { icon: '❄️', text: 'بەفربارین' };
      if (code <= 82) return { icon: '🌦️', text: 'تاوە باران' };
      if (code >= 95) return { icon: '⛈️', text: 'هەورە بروسکە و باران' };
      return { icon: '🌤️', text: 'کەشوهەوای ئاسایی' };
    }

    function renderUI() {
      const tabsEl = document.getElementById('cityTabs');
      const listEl = document.getElementById('citiesList');
      tabsEl.innerHTML = '';
      listEl.innerHTML = '';

      cities.forEach(city => {
        const data = weatherData[city.id];
        const tab = document.createElement('button');
        tab.className = 'city-tab' + (city.id === currentCityId ? ' active' : '');
        tab.textContent = city.name;
        tab.onclick = () => { currentCityId = city.id; renderUI(); };
        tabsEl.appendChild(tab);

        if (data) {
          const info = getWeatherInfo(data.weather_code);
          const item = document.createElement('div');
          item.className = 'city-list-item';
          item.onclick = () => { currentCityId = city.id; renderUI(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
          item.innerHTML = `
            <div class="city-list-left">
              <span style="font-size:1.8rem">${info.icon}</span>
              <div>
                <div class="city-list-name">${city.name}</div>
                <div class="city-list-desc">${info.text}</div>
              </div>
            </div>
            <div class="city-list-temp">${Math.round(data.temperature_2m)}°C</div>
          `;
          listEl.appendChild(item);
        }
      });

      const activeCity = cities.find(c => c.id === currentCityId);
      const activeData = weatherData[currentCityId];
      if (activeCity && activeData) {
        const info = getWeatherInfo(activeData.weather_code);
        document.getElementById('selectedName').textContent = activeCity.name;
        document.getElementById('selectedIcon').textContent = info.icon;
        document.getElementById('selectedTemp').textContent = `${Math.round(activeData.temperature_2m)}°C`;
        document.getElementById('selectedDesc').textContent = info.text;
        document.getElementById('selectedWind').textContent = `${activeData.wind_speed_10m} km/h`;
        document.getElementById('selectedHumidity').textContent = `${activeData.relative_humidity_2m}%`;
        document.getElementById('selectedRain').textContent = `${activeData.precipitation} mm`;
      }
    }

    async function loadAllWeather() {
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = 'خەریکی نوێکردنەوەی داتاکانە...';
      try {
        const lats = cities.map(c => c.lat).join(',');
        const lons = cities.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&timezone=auto`;
        const res = await fetch(url);
        const json = await res.json();
        const results = Array.isArray(json) ? json : [json];
        results.forEach((item, idx) => {
          weatherData[cities[idx].id] = item.current;
        });
        statusEl.textContent = 'نوێکرایەوە ✓ (سەرچاوە: Open-Meteo)';
        renderUI();
      } catch (e) {
        statusEl.textContent = 'ئۆفلاین - پەیوەندی ئینتەرنێت بپشکنە';
        renderUI();
      }
    }

    loadAllWeather();
  </script>
</body>
</html>
