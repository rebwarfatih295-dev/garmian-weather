workflows:
  ios-ipa-build:
    name: Build Garmian Weather IPA (Rebwar Manj Ali)
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies and add iOS platform
        script: |
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build proper IPA for Sideloadly
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          chmod -R 755 Payload/App.app
          zip -qry GarmianWeather.ipa Payload
    artifacts:
      - ios/App/GarmianWeather.ipa
