workflows:
  android-apk-build:
    name: Build Garmian Weather Android APK (Rebwar Manj Ali)
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies and generate Android App Icon
        script: |
          npm install
          npm install @capacitor/android@^6.0.0 @capacitor/assets --save-dev
          mkdir -p assets
          sips -s format png -z 1024 1024 icon.png --out assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          cp assets/icon-only.png assets/icon-background.png
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build Signed Release Android APK
        script: |
          cd android
          keytool -genkey -v -keystore garmian.keystore -alias garmian_key -keyalg RSA -keysize 2048 -validity 10000 -storepass garmian2026 -keypass garmian2026 -dname "CN=Rebwar Manj Ali, OU=Garmiyan Weather, O=Garmiyan, L=Kalar, S=Sulaymaniyah, C=IQ"
          chmod +x gradlew
          ./gradlew assembleRelease
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner sign --ks garmian.keystore --ks-pass pass:garmian2026 --key-pass pass:garmian2026 --out ../GarmianWeather-Release.apk app-release-aligned.apk
    artifacts:
      - GarmianWeather-Release.apk
